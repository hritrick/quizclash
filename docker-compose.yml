services:
  mongo:
    image: mongo:7.0
    container_name: quizclash-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: quizclash
    volumes:
      - mongo-data:/data/db
    networks:
      - quizclash-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: quizclash-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/quizclash
      JWT_SECRET: ${JWT_SECRET:?Set a private JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set a private JWT_REFRESH_SECRET in .env}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set a private COOKIE_SECRET in .env}
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongo
    networks:
      - quizclash-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: quizclash-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - quizclash-network

networks:
  quizclash-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
