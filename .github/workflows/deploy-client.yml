name: Verify Vercel Production Deployment

on:
  workflow_run:
    workflows: [CI Pipeline]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Vercel's connected Git integration performs deployment on push.
      - name: Verify deployed commit, database, API, and WebSockets
        run: node scripts/verify-deployment.mjs https://quizclash-eta.vercel.app "${{ github.event.workflow_run.head_sha || github.sha }}" https://quizclash-06yc.onrender.com
